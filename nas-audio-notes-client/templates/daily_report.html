<!DOCTYPE html>
<html lang="zh-CN" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日声音小报 | Audio Notes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        ink: '#07111f',
                        panel: '#101827',
                        line: '#223047',
                        mint: '#22c55e',
                        sky: '#38bdf8',
                        rose: '#fb7185',
                        amber: '#f59e0b'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background:
                radial-gradient(circle at 18% 12%, rgba(56, 189, 248, 0.12), transparent 28%),
                radial-gradient(circle at 90% 4%, rgba(34, 197, 94, 0.10), transparent 28%),
                #07111f;
            color: #f8fafc;
        }

        .report-panel {
            background: rgba(16, 24, 39, 0.78);
            border: 1px solid rgba(148, 163, 184, 0.16);
            backdrop-filter: blur(14px);
        }

        .metric {
            background: rgba(15, 23, 42, 0.86);
            border: 1px solid rgba(148, 163, 184, 0.14);
        }
    </style>
</head>

<body class="min-h-screen font-sans">
    <main class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
        <header class="mb-6 flex flex-col gap-4 border-b border-white/10 pb-5 lg:flex-row lg:items-end lg:justify-between">
            <div>
                <a href="/" class="mb-4 inline-flex items-center gap-2 text-sm text-slate-400 hover:text-white">
                    <i class="fa-solid fa-arrow-left"></i>
                    返回 Audio Notes
                </a>
                <h1 class="text-3xl font-extrabold tracking-normal text-white sm:text-4xl">每日声音小报</h1>
                <p class="mt-2 text-sm text-slate-400">把一天的对话、情绪、哭声事件和家庭瞬间收束成一页。</p>
            </div>
            <div class="report-panel flex flex-wrap items-center gap-3 rounded-lg p-3">
                <button onclick="shiftDate(-1)" class="rounded-md border border-white/10 bg-white/5 px-3 py-2 text-sm text-slate-200 hover:bg-white/10" title="前一天">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <input id="reportDate" type="date" class="rounded-md border border-white/10 bg-slate-950 px-3 py-2 text-sm text-white outline-none focus:border-sky-400">
                <button onclick="shiftDate(1)" class="rounded-md border border-white/10 bg-white/5 px-3 py-2 text-sm text-slate-200 hover:bg-white/10" title="后一天">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
                <button onclick="loadReport()" class="rounded-md bg-sky-500 px-4 py-2 text-sm font-semibold text-white hover:bg-sky-400">
                    <i class="fa-solid fa-rotate-right mr-2"></i>刷新
                </button>
            </div>
        </header>

        <section id="loading" class="report-panel rounded-lg p-10 text-center text-slate-300">
            <i class="fa-solid fa-circle-notch fa-spin mr-2 text-sky-400"></i>
            正在整理这一天的声音...
        </section>

        <section id="report" class="hidden space-y-6">
            <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-4">
                <div class="metric rounded-lg p-5">
                    <div class="mb-3 flex items-center justify-between text-slate-400">
                        <span class="text-sm">录音记录</span>
                        <i class="fa-solid fa-file-audio text-sky-400"></i>
                    </div>
                    <div id="statRecordings" class="text-3xl font-bold">0</div>
                    <div id="statSegments" class="mt-1 text-xs text-slate-500">0 个片段</div>
                </div>
                <div class="metric rounded-lg p-5">
                    <div class="mb-3 flex items-center justify-between text-slate-400">
                        <span class="text-sm">说话时长</span>
                        <i class="fa-solid fa-wave-square text-mint"></i>
                    </div>
                    <div id="statSpeech" class="text-3xl font-bold">0</div>
                    <div class="mt-1 text-xs text-slate-500">分钟</div>
                </div>
                <div class="metric rounded-lg p-5">
                    <div class="mb-3 flex items-center justify-between text-slate-400">
                        <span class="text-sm">哭声事件</span>
                        <i class="fa-solid fa-baby text-amber"></i>
                    </div>
                    <div id="statCries" class="text-3xl font-bold">0</div>
                    <div id="statBusiestHour" class="mt-1 text-xs text-slate-500">活跃时段 暂无</div>
                </div>
                <div class="metric rounded-lg p-5">
                    <div class="mb-3 flex items-center justify-between text-slate-400">
                        <span class="text-sm">主角</span>
                        <i class="fa-solid fa-user-astronaut text-rose"></i>
                    </div>
                    <div id="statTopSpeaker" class="truncate text-3xl font-bold">暂无</div>
                    <div id="statTopEmotion" class="mt-1 text-xs text-slate-500">情绪 暂无</div>
                </div>
            </div>

            <div class="grid gap-6 xl:grid-cols-[1.2fr_0.8fr]">
                <section class="report-panel rounded-lg p-5">
                    <div class="mb-4 flex items-center justify-between">
                        <h2 class="text-lg font-bold">一天的节奏</h2>
                        <span class="text-xs text-slate-500">按小时聚合</span>
                    </div>
                    <div class="h-72">
                        <canvas id="hourChart"></canvas>
                    </div>
                </section>

                <section class="report-panel rounded-lg p-5">
                    <h2 class="mb-4 text-lg font-bold">关键词</h2>
                    <div id="keywords" class="flex flex-wrap gap-2"></div>
                    <div class="mt-6 grid grid-cols-2 gap-4">
                        <div>
                            <h3 class="mb-3 text-sm font-semibold text-slate-300">情绪</h3>
                            <div id="emotions" class="space-y-2 text-sm"></div>
                        </div>
                        <div>
                            <h3 class="mb-3 text-sm font-semibold text-slate-300">哭声分类</h3>
                            <div id="cryCategories" class="space-y-2 text-sm"></div>
                        </div>
                    </div>
                </section>
            </div>

            <div class="grid gap-6 xl:grid-cols-2">
                <section class="report-panel rounded-lg p-5">
                    <h2 class="mb-4 text-lg font-bold">说话人</h2>
                    <div id="speakers" class="space-y-3"></div>
                </section>

                <section class="report-panel rounded-lg p-5">
                    <h2 class="mb-4 text-lg font-bold">今日摘录</h2>
                    <div id="quotes" class="space-y-3"></div>
                </section>
            </div>

            <div class="grid gap-6 xl:grid-cols-[0.9fr_1.1fr]">
                <section class="report-panel rounded-lg p-5">
                    <h2 class="mb-4 text-lg font-bold">哭声事件</h2>
                    <div id="cryEvents" class="space-y-3"></div>
                </section>

                <section class="report-panel rounded-lg p-5">
                    <h2 class="mb-4 text-lg font-bold">时间线</h2>
                    <div id="timeline" class="max-h-[520px] space-y-3 overflow-y-auto pr-2"></div>
                </section>
            </div>
        </section>
    </main>

    <script>
        let hourChart = null;

        function padDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function formatShortTime(value) {
            if (!value) return '';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return '';
            return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
        }

        function escapeHtml(value) {
            return String(value || '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function emptyState(text) {
            return `<div class="rounded-md border border-dashed border-white/10 p-4 text-sm text-slate-500">${text}</div>`;
        }

        function renderPairs(containerId, data, emptyText) {
            const container = document.getElementById(containerId);
            const entries = Object.entries(data || {}).sort((a, b) => b[1] - a[1]);
            if (!entries.length) {
                container.innerHTML = emptyState(emptyText);
                return;
            }
            container.innerHTML = entries.map(([name, count]) => `
                <div class="flex items-center justify-between rounded-md bg-white/5 px-3 py-2">
                    <span class="truncate text-slate-300">${escapeHtml(name)}</span>
                    <span class="font-mono text-slate-500">${count}</span>
                </div>
            `).join('');
        }

        function renderHourChart(hourActivity) {
            const ctx = document.getElementById('hourChart');
            const labels = hourActivity.map(item => item.hour);
            const values = hourActivity.map(item => item.count);
            if (hourChart) hourChart.destroy();
            hourChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels,
                    datasets: [{
                        data: values,
                        backgroundColor: values.map(value => value > 0 ? 'rgba(56, 189, 248, 0.72)' : 'rgba(148, 163, 184, 0.12)'),
                        borderColor: 'rgba(56, 189, 248, 0.9)',
                        borderWidth: 1,
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: 'rgba(148, 163, 184, 0.08)' }, ticks: { color: '#94a3b8', maxRotation: 0, autoSkip: true, maxTicksLimit: 12 } },
                        y: { beginAtZero: true, grid: { color: 'rgba(148, 163, 184, 0.10)' }, ticks: { color: '#94a3b8', precision: 0 } }
                    }
                }
            });
        }

        function renderReport(data) {
            document.getElementById('statRecordings').textContent = data.stats.recordings;
            document.getElementById('statSegments').textContent = `${data.stats.segments} 个片段`;
            document.getElementById('statSpeech').textContent = data.stats.speech_minutes;
            document.getElementById('statCries').textContent = data.stats.cry_events;
            document.getElementById('statBusiestHour').textContent = `活跃时段 ${data.stats.busiest_hour}`;
            document.getElementById('statTopSpeaker').textContent = data.stats.top_speaker;
            document.getElementById('statTopEmotion').textContent = `情绪 ${data.stats.top_emotion}`;

            renderHourChart(data.hour_activity || []);
            renderPairs('emotions', data.emotions, '暂无情绪数据');
            renderPairs('cryCategories', data.cry_categories, '暂无哭声分类');

            const keywords = document.getElementById('keywords');
            keywords.innerHTML = (data.keywords || []).length
                ? data.keywords.map(item => `<span class="rounded-full border border-sky-400/20 bg-sky-400/10 px-3 py-1 text-sm text-sky-200">${escapeHtml(item.text)} <span class="text-sky-400/70">${item.count}</span></span>`).join('')
                : emptyState('暂无关键词');

            const speakers = document.getElementById('speakers');
            speakers.innerHTML = (data.speakers || []).length
                ? data.speakers.map(speaker => `
                    <div class="rounded-md bg-white/5 p-3">
                        <div class="mb-2 flex items-center justify-between gap-3">
                            <span class="truncate font-semibold text-white">${escapeHtml(speaker.name)}</span>
                            <span class="text-xs text-slate-500">${speaker.duration_seconds}s</span>
                        </div>
                        <div class="h-2 overflow-hidden rounded-full bg-slate-800">
                            <div class="h-full rounded-full bg-mint" style="width:${Math.min(100, speaker.segments * 4)}%"></div>
                        </div>
                        <div class="mt-2 text-xs text-slate-500">${speaker.segments} 段 · ${speaker.chars} 字</div>
                    </div>
                `).join('')
                : emptyState('这一天还没有说话人数据');

            const quotes = document.getElementById('quotes');
            quotes.innerHTML = (data.quotes || []).length
                ? data.quotes.map(item => `
                    <blockquote class="rounded-md border-l-2 border-sky-400 bg-white/5 p-3">
                        <p class="text-sm leading-6 text-slate-200">${escapeHtml(item.text)}</p>
                        <footer class="mt-2 text-xs text-slate-500">${escapeHtml(item.speaker)} · ${formatShortTime(item.time)} ${item.emotion ? '· ' + escapeHtml(item.emotion) : ''}</footer>
                    </blockquote>
                `).join('')
                : emptyState('还没有适合摘录的句子');

            const cryEvents = document.getElementById('cryEvents');
            cryEvents.innerHTML = (data.cry_events || []).length
                ? data.cry_events.map(event => `
                    <article class="rounded-md border border-amber-400/20 bg-amber-400/10 p-3">
                        <div class="mb-2 flex items-center justify-between gap-3">
                            <span class="rounded-full bg-amber-400/20 px-2 py-1 text-xs font-semibold text-amber-200">${escapeHtml(event.reason_category || '未分类')}</span>
                            <span class="text-xs text-slate-500">${formatShortTime(event.recording_time || event.created_at)}</span>
                        </div>
                        <p class="line-clamp-3 text-sm leading-6 text-slate-200">${escapeHtml(event.reason || '分析还在路上')}</p>
                        ${event.illustration_url ? `<img src="${event.illustration_url}" alt="哭声事件插图" class="mt-3 aspect-video w-full rounded-md object-cover">` : ''}
                    </article>
                `).join('')
                : emptyState('这一天没有哭声事件');

            const timeline = document.getElementById('timeline');
            timeline.innerHTML = (data.timeline || []).length
                ? data.timeline.map(item => `
                    <div class="grid grid-cols-[64px_1fr] gap-3">
                        <div class="pt-1 text-right font-mono text-xs text-slate-500">${formatShortTime(item.time)}</div>
                        <div class="rounded-md border ${item.type === 'cry' ? 'border-amber-400/20 bg-amber-400/10' : 'border-white/10 bg-white/5'} p-3">
                            <div class="text-sm font-semibold text-white">${escapeHtml(item.label)}</div>
                            <div class="mt-1 text-xs leading-5 text-slate-400">${escapeHtml(item.text)}</div>
                        </div>
                    </div>
                `).join('')
                : emptyState('这一天还没有声音时间线');
        }

        async function loadReport() {
            const date = document.getElementById('reportDate').value;
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('report').classList.add('hidden');
            try {
                const res = await fetch(`/api/daily_report?date=${encodeURIComponent(date)}`);
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || '加载失败');
                renderReport(data);
                document.getElementById('report').classList.remove('hidden');
            } catch (error) {
                document.getElementById('loading').innerHTML = `<div class="text-rose-300"><i class="fa-solid fa-triangle-exclamation mr-2"></i>${escapeHtml(error.message)}</div>`;
                return;
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        function shiftDate(delta) {
            const input = document.getElementById('reportDate');
            const current = input.value ? new Date(input.value + 'T00:00:00') : new Date();
            current.setDate(current.getDate() + delta);
            input.value = padDate(current);
            loadReport();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('reportDate');
            input.value = padDate(new Date());
            input.addEventListener('change', loadReport);
            loadReport();
        });
    </script>
</body>

</html>
