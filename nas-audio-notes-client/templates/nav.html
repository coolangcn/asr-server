<!-- 顶部导航（自包含样式，Tailwind 有无均可） -->
<div id="asr-nav" style="position:sticky;top:0;z-index:900;background:rgba(9,17,31,.94);border-bottom:1px solid #223047;backdrop-filter:blur(6px);">
    <div style="max-width:72rem;margin:0 auto;padding:0 12px;display:flex;align-items:center;gap:4px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;">
        <span style="font-weight:800;font-size:14px;color:#e2e8f0;padding:9px 8px 9px 0;flex-shrink:0;">🎙️ ASR</span>
        <a href="/?desktop=1" data-nav="/" style="flex-shrink:0;font-size:13px;padding:6px 11px;border-radius:8px;color:#94a3b8;text-decoration:none;">🏠 面板</a>
        <a href="/daily" data-nav="/daily" style="flex-shrink:0;font-size:13px;padding:6px 11px;border-radius:8px;color:#94a3b8;text-decoration:none;">📻 每日小报</a>
        <a href="/growth" data-nav="/growth" style="flex-shrink:0;font-size:13px;padding:6px 11px;border-radius:8px;color:#94a3b8;text-decoration:none;">📔 成长词典</a>
        <a href="/picturebook" data-nav="/picturebook" style="flex-shrink:0;font-size:13px;padding:6px 11px;border-radius:8px;color:#94a3b8;text-decoration:none;">📖 绘本日记</a>
        <a href="/adb" data-nav="/adb" style="flex-shrink:0;font-size:13px;padding:6px 11px;border-radius:8px;color:#94a3b8;text-decoration:none;">📲 录音集群</a>
        <a href="/mobile" data-nav="/mobile" style="flex-shrink:0;font-size:13px;padding:6px 11px;border-radius:8px;color:#94a3b8;text-decoration:none;">📱 手机端</a>
    </div>
</div>
<script>
(function () {
    var path = location.pathname.replace(/\/$/, '') || '/';
    var links = document.querySelectorAll('#asr-nav a[data-nav]');
    for (var i = 0; i < links.length; i++) {
        var target = links[i].getAttribute('data-nav');
        var active = (path === target) || (target !== '/' && path.indexOf(target) === 0);
        if (active) {
            links[i].style.background = 'rgba(34,197,94,.14)';
            links[i].style.color = '#4ade80';
        }
    }
})();
</script>
