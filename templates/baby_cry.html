<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👶 宝宝哭闹分析仪表盘</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-light: #818cf8;
            --secondary: #ec4899;
            --accent: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }

        /* Glassmorphism Header */
        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            background: linear-gradient(135deg, #fff 30%, var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--text-dim);
            font-weight: 400;
        }

        /* Action Bar */
        .action-bar {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            padding: 1.2rem 2rem;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.8s ease-out;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
            animation: pulse 2s infinite;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #4338ca);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: inherit;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -5px var(--primary);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }



        .event-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
            contain: layout style paint;
            will-change: border-color, box-shadow;
        }

        .event-card:hover {
            border-color: var(--primary-light);
            box-shadow: 0 12px 24px -8px rgba(99, 102, 241, 0.25);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .category-badge {
            padding: 0.35rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary-light);
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .category-badge.pain { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border-color: rgba(239, 68, 68, 0.3); }
        .category-badge.hungry { background: rgba(245, 158, 11, 0.2); color: #fcd34d; border-color: rgba(245, 158, 11, 0.3); }
        .category-badge.incomplete { background: rgba(239, 68, 68, 0.25); color: #fca5a5; border-color: rgba(239, 68, 68, 0.4); animation: badge-pulse 2s infinite; }

        /* 不完整事件卡片 - 红色警告 */
        .event-card.incomplete {
            border-color: rgba(239, 68, 68, 0.5);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.15);
        }
        .event-card.incomplete::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.05), transparent);
            pointer-events: none;
            z-index: 0;
        }
        .event-card.incomplete:hover {
            border-color: rgba(239, 68, 68, 0.7);
            box-shadow: 0 12px 24px -8px rgba(239, 68, 68, 0.2);
        }
        .incomplete-warning {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            padding: 0.6rem 0.8rem;
            font-size: 0.8rem;
            color: #fca5a5;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            grid-column: 1 / -1;
        }
        .incomplete-warning .warn-icon {
            font-size: 1.1rem;
            animation: warn-blink 1.5s infinite;
        }
        @keyframes warn-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        @keyframes badge-pulse {
            0%, 100% { border-color: rgba(239, 68, 68, 0.4); }
            50% { border-color: rgba(239, 68, 68, 0.8); }
        }

        .time-info {
            font-size: 0.8rem;
            color: var(--text-dim);
            font-weight: 500;
        }

        .card-body {
            display: grid;
            grid-template-columns: 1fr 120px;
            gap: 1rem;
            align-items: start;
        }

        .card-body h3 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            margin-bottom: 0.75rem;
            line-height: 1.4;
        }

        .reason-content {
            flex: 1;
        }

        .cry-illustration {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(16, 185, 129, 0.1));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            border: 2px solid rgba(99, 102, 241, 0.2);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .cry-illustration::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
        }

        .cry-illustration img {
            border-radius: 12px;
            position: relative;
            z-index: 10;
        }

        .cry-illustration img.loading {
            opacity: 0.5;
            animation: loading-pulse 1.5s infinite;
        }

        .ill-placeholder {
            font-size: 2.5rem;
            opacity: 0.7;
        }

        /* 紧凑模式卡片 */
        .card-body-compact {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 0;
        }
        .reason-preview {
            flex: 1;
            font-size: 0.88rem;
            color: var(--text-secondary);
            line-height: 1.4;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .ill-tag {
            font-size: 1.2rem;
            flex-shrink: 0;
            opacity: 0.7;
        }

        /* 建议预览 */
        .suggestion-preview {
            background: rgba(16, 185, 129, 0.06);
            border-left: 2px solid rgba(16, 185, 129, 0.4);
            border-radius: 0 8px 8px 0;
            padding: 0.5rem 0.7rem;
            margin-top: 0.6rem;
            font-size: 0.78rem;
            line-height: 1.5;
            color: #6ee7b7;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .suggestion-preview .sug-label {
            font-weight: 600;
            color: rgba(16, 185, 129, 0.8);
            margin-right: 4px;
        }

        /* 卡片内播放按钮 */
        .card-play-btns {
            display: flex;
            gap: 6px;
            margin-top: 0.6rem;
        }
        .card-play-btn {
            padding: 5px 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.04);
            color: var(--text-dim);
            font-size: 0.72rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .card-play-btn:hover {
            border-color: var(--primary-light);
            color: var(--primary-light);
            background: rgba(99,102,241,0.1);
        }
        .card-play-btn.playing {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(16,185,129,0.1);
        }
        .card-play-btn .play-icon { font-size: 0.8rem; }
        .card-footer {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            padding-top: 0.6rem;
        }

        /* 详情弹窗 */
        .detail-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(12px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.15s ease;
        }
        .detail-overlay.active { display: flex; }
        @keyframes fadeIn { from{opacity:0} to{opacity:1} }
        .detail-panel {
            background: var(--card-bg);
            border-radius: 24px;
            width: 90%; max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 2rem;
            position: relative;
            box-shadow: 0 25px 60px -10px rgba(0,0,0,0.45);
            animation: slideUp 0.25s ease;
        }
        @keyframes slideUp { from{transform:translateY(30px);opacity:0} to{transform:translateY(0);opacity:1} }
        .detail-close {
            position: absolute; top: 1rem; right: 1rem;
            background: none; border: none; color: var(--text-muted);
            font-size: 1.5rem; cursor: pointer;
            transition: color 0.2s, transform 0.2s;
        }
        .detail-close:hover { color: #fca5a5; transform: rotate(90deg); }
        .detail-header { margin-bottom: 1.25rem; }
        .detail-header h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.35rem; margin-bottom: 0.5rem;
            line-height: 1.4; color: #fff;
        }
        .detail-meta { display: flex; gap: 1rem; flex-wrap: wrap; font-size: 0.82rem; color: var(--text-muted); }
        .detail-body { display: grid; gap: 1.25rem; }
        .detail-section-title {
            font-size: 0.78rem; text-transform: uppercase;
            letter-spacing: 0.08em; color: var(--primary-light);
            font-weight: 700; margin-bottom: 0.5rem;
        }
        .advice-box-detail {
            background: linear-gradient(135deg, rgba(16,185,129,0.08), rgba(99,102,241,0.06));
            border-left: 3px solid #10b981;
            border-radius: 0 12px 12px 0;
            padding: 1rem 1.1rem; font-size: 0.9rem;
            line-height: 1.7; color: #d1d5db;
        }
        .advice-box-detail ol { margin: 0.5rem 0 0 1.1rem; padding: 0; }
        .advice-box-detail li { margin-bottom: 0.35rem; }
        .detail-img-wrap {
            display: flex; justify-content: center; padding: 0.5rem 0;
        }
        .detail-img-wrap img {
            border-radius: 16px; max-width: 280px; max-height: 280px;
            object-fit: cover; box-shadow: 0 8px 24px -6px rgba(0,0,0,0.3);
        }
        .detail-loading {
            text-align: center; color: var(--text-muted);
            padding: 3rem; font-size: 0.9rem;
        }

        /* 详情弹窗音频列表 */
        .detail-section { margin-bottom: 1.25rem; }
        .detail-audio-list {
            display: flex; flex-direction: column; gap: 8px;
        }
        .detail-audio-item {
            display: flex; align-items: center; gap: 10px;
            background: rgba(0,0,0,0.2); border-radius: 10px; padding: 8px 12px;
        }
        .detail-audio-icon { font-size: 1rem; flex-shrink: 0; }
        .detail-audio-label { font-size: 0.72rem; color: var(--primary-light); font-weight: 600; flex-shrink: 0; }
        .detail-audio-name { font-size: 0.7rem; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
        .detail-audio-item audio { display: none; }
        .detail-play-btn {
            padding: 4px 10px; border-radius: 8px; border: 1px solid rgba(99,102,241,0.3);
            background: rgba(99,102,241,0.1); color: var(--primary-light); font-size: 0.72rem;
            cursor: pointer; flex-shrink: 0; transition: all 0.2s; font-family: inherit;
        }
        .detail-play-btn:hover { background: rgba(99,102,241,0.2); }

        @keyframes loading-pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }

        .advice-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 1rem;
            font-size: 0.85rem;
            color: var(--text-dim);
            border-left: 3px solid var(--primary);
            margin-bottom: 1rem;
            grid-column: 1 / -1;
        }

        .advice-box ol {
            padding-left: 1.2rem;
            margin: 0;
        }

        .advice-box li {
            margin-bottom: 0.5rem;
            line-height: 1.5;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-dim);
            border-top: 1px solid var(--border);
            padding-top: 1rem;
        }

        .duration-tag {
            background: #1e293b;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            color: var(--text-main);
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Main Content Layout - Side by Side (Full Height) */
        .main-content-wrapper {
            display: grid;
            grid-template-columns: 420px 1fr;
            gap: 1.5rem;
            margin-top: 2rem;
            height: calc(100vh - 220px);
            align-items: stretch;
        }

        /* Log Container - Vertical Layout */
        #logContainer {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #logContainer:hover {
            border-color: rgba(99, 102, 241, 0.5);
            z-index: 10;
        }

        #logContainer::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
            z-index: 10;
        }

        .terminal-header {
            background: #0f172a;
            padding: 0.5rem 1rem;
            display: flex;
            gap: 0.4rem;
            border-bottom: 1px solid #334155;
            flex-shrink: 0;
        }

        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot.red { background: #ff5f56; }
        .dot.yellow { background: #ffbd2e; }
        .dot.green { background: #27c93f; }

        #processLogs {
            background: #020617;
            color: #10b981;
            padding: 1.5rem;
            font-family: 'Fira Code', 'Courier New', monospace;
            flex: 1;
            overflow-y: auto;
            font-size: 0.85rem;
            white-space: pre-wrap;
            line-height: 1.6;
            scrollbar-width: thin;
            scrollbar-color: #334155 #020617;
        }

        #processLogs::-webkit-scrollbar { width: 6px; }
        #processLogs::-webkit-scrollbar-track { background: #020617; }
        #processLogs::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        /* Grid View */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 1.5rem;
            height: 100%;
            overflow-y: auto;
            padding-right: 8px;
            border-radius: 12px;
            border: 1px solid transparent;
        }

        .grid-container::-webkit-scrollbar { width: 8px; }
        .grid-container::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); border-radius: 10px; }
        .grid-container::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.5); border-radius: 10px; }
        .grid-container::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.7); }
        @media (max-width: 1200px) {
            .main-content-wrapper {
                grid-template-columns: 1fr;
                height: auto;
            }
            #logContainer {
                position: relative;
                height: 400px;
                min-height: auto;
            }
            .grid-container {
                max-height: none;
                overflow: visible;
                padding-right: 0;
            }
        }

        @media (max-width: 768px) {
            .action-bar { flex-direction: column; gap: 1rem; align-items: stretch; }
            .grid-container { grid-template-columns: 1fr; }
        }

        /* Loading Skeleton */
        .skeleton {
            background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>👶 宝宝情感与哭闹分析</h1>
            <p class="subtitle">深度多模态行为追踪系统</p>
        </header>

        <div class="action-bar">
            <div class="status-badge">
                <div class="status-dot"></div>
                <span id="triggerStatus">系统就绪，实时监控中</span>
            </div>
            <div style="display: flex; align-items: center; gap: 1rem;">
                <label style="font-size: 0.85rem; color: var(--text-dim); cursor: pointer; display: flex; align-items: center; gap: 0.3rem;">
                    <input type="checkbox" id="replaceCheck" style="accent-color: var(--primary);"> 覆盖分析结果
                </label>
                <button id="reprocessBtn" class="btn-primary" onclick="triggerReprocess()">
                    <span>🚀</span> 启动历史回顾分析
                </button>
            </div>
        </div>
        
        <div class="main-content-wrapper">
            <!-- 左侧：日志面板 (420px) -->
            <div id="logContainer">
                <div class="terminal-header">
                    <div class="dot red"></div>
                    <div class="dot yellow"></div>
                    <div class="dot green"></div>
                </div>
                <div id="processLogs">等待分析任务启动...</div>
            </div>
            
            <!-- 右侧：结果网格 (自适应) -->
            <div class="grid-container" id="cryData">
                <!-- Data populated by JS -->
                <div class="status" style="grid-column: 1/-1; text-align: center; padding: 4rem; color: var(--text-dim);">
                    🛸 正在对接神经网络数据...
                </div>
            </div>
        </div>
    </div>

    <script>
        let eventsInterval = null;
        
        window.addEventListener('DOMContentLoaded', async () => {
            await loadCryEvents();
            // 每30秒自动刷新事件列表（低频）
            eventsInterval = setInterval(loadCryEvents, 30000);
        });
        
        // 页面不可见时暂停轮询，恢复时重启
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                // 页面隐藏时暂停轮询
                if (eventsInterval) {
                    clearInterval(eventsInterval);
                    eventsInterval = null;
                }
                if (logInterval) {
                    clearInterval(logInterval);
                }
                console.log('[BabyCry] 页面隐藏，暂停轮询');
            } else {
                // 页面显示时恢复轮询
                if (!eventsInterval) {
                    eventsInterval = setInterval(loadCryEvents, 30000);
                }
                if (!logInterval && document.getElementById('logContainer').style.display === 'block') {
                    logInterval = setInterval(fetchLogs, 2000);
                }
                console.log('[BabyCry] 页面显示，恢复轮询');
            }
        });

        // 缓存已渲染的事件ID，避免重复渲染
        let renderedEventIds = new Set();
        let lastEventsHash = '';
        let eventsLoading = false;  // 防止并发请求
        let _webPlayingAudio = null;  // 当前播放的音频

        async function loadCryEvents() {
            if (eventsLoading) return;
            eventsLoading = true;
            const container = document.getElementById('cryData');
            try {
                const response = await fetch('/api/cry_events?limit=30');
                const result = await response.json();

                if (response.ok) {
                    const events = result.events;
                    if (events.length === 0) {
                        container.innerHTML = '<div class="status" style="grid-column: 1/-1;">📭 观测范围内未见异常行为</div>';
                        renderedEventIds.clear();
                        lastEventsHash = '';
                        return;
                    }

                    // 计算事件哈希（包含分类信息，这样分析完成后会触发重渲染）
                    const eventsHash = events.map(e => e.id + ':' + (e.reason_category || '') + ':' + (e.suggestion_preview || '')).join(',');
                    if (eventsHash === lastEventsHash) {
                        console.log('[BabyCry] 数据无变化，跳过渲染');
                        return;
                    }
                    lastEventsHash = eventsHash;

                    // 全量重新渲染（确保分类变化时UI同步更新）
                    let html = '';

                    events.forEach((ev, index) => {
                        const recTime = new Date(ev.recording_time || ev.created_at);
                        const dateStr = recTime.toLocaleDateString();
                        const timeStr = recTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                        const start = ev.start_time.toFixed(1);
                        const end = ev.end_time.toFixed(1);

                        const reason = ev.reason_preview || '未知诱因';
                        const category = (ev.reason_category || 'pending').toLowerCase();
                        const hasIllustration = ev.has_illustration || false;

                        // 判断是否为不完整事件
                        const isIncomplete = !ev.reason_category || ev.reason_category === '未知'
                            || category === 'analyzing' || category === '未分类';
                        const incompleteClass = isIncomplete ? ' incomplete' : '';
                        const incompleteCatClass = isIncomplete ? ' incomplete' : '';

                        // Map category to icon
                        let icon = '🍼';
                        if (category.includes('饿') || category.includes('hungry')) icon = '🍼';
                        if (category.includes('痛') || category.includes('pain')) icon = '❤️‍🩹';
                        if (category.includes('困') || category.includes('sleepy')) icon = '😴';
                        if (category.includes('情绪') || category.includes('emotion')) icon = '🧸';

                        const reasonPreview = reason;

                        // 建议预览
                        let sugHtml = '';
                        if (ev.suggestion_preview) {
                            sugHtml = `<div class="suggestion-preview"><span class="sug-label">💡</span>${ev.suggestion_preview}</div>`;
                        } else if (isIncomplete) {
                            sugHtml = `<div class="suggestion-preview" style="border-left-color:rgba(245,158,11,0.4);color:rgba(245,158,11,0.7);background:rgba(245,158,11,0.05);"><span class="sug-label">⏳</span>等待历史回顾分析</div>`;
                        }

                        // 播放按钮（仅已完成事件）
                        let playBtns = '';
                        if (!isIncomplete) {
                            playBtns = `
                                <div class="card-play-btns">
                                    <button class="card-play-btn" onclick="event.stopPropagation();playWebCryAudio(${ev.id}, this)">
                                        <span class="play-icon">▶</span> 哭声原声
                                    </button>
                                    <button class="card-play-btn" onclick="event.stopPropagation();playWebContextAudio(${ev.id}, this)">
                                        <span class="play-icon">📝</span> 上下文
                                    </button>
                                </div>`;
                        }

                        html += `
                            <div class="event-card${incompleteClass}" data-event-id="${ev.id}" onclick="showEventDetail(${ev.id})" style="cursor:pointer;">
                                <div class="card-header">
                                    <div class="category-badge${incompleteCatClass}">${isIncomplete ? '⚠️' : icon} ${isIncomplete ? '分析未完成' : (ev.reason_category || '行为分析')}</div>
                                    <div class="time-info">
                                        <div style="font-size:0.9rem;color:#fff;">${timeStr}</div>
                                        <div>${dateStr}</div>
                                    </div>
                                </div>
                                ${isIncomplete ? `<div class="incomplete-warning"><span class="warn-icon">⚠️</span><span>该事件分析未完成（${ev.reason_category||'无分类'}），下次历史回顾将自动重跑</span></div>` : ''}
                                <div class="card-body-compact">
                                    <div class="reason-preview">${reasonPreview}</div>
                                    ${hasIllustration ? '<span class="ill-tag" title="有插图">🎨</span>' : ''}
                                </div>
                                ${sugHtml}
                                ${playBtns}
                                <div class="card-footer">
                                    <div>⏱️ ${start}-${end}s</div>
                                    <div>📁 ${ev.file_count||0} 文件</div>
                                    <div style="color:var(--text-muted);margin-left:auto;font-size:0.75rem;">点击查看详情 ▸</div>
                                </div>
                            </div>
                        `;
                    });

                    container.innerHTML = html;
                    renderedEventIds = new Set(events.map(e => e.id));

                } else {
                    container.innerHTML = `<div class="status" style="grid-column: 1/-1; color: var(--danger);">⚠️ 系统同步异常: ${result.error}</div>`;
                }
            } catch (error) {
                console.error('[BabyCry] 加载失败:', error);
            } finally {
                eventsLoading = false;
            }
        }

        let logInterval = null;
        let lastLogContent = '';  // 用于检测日志是否有变化
        let noChangeCount = 0;    // 连续无变化计数
        let logLoading = false;   // 防止并发请求

        async function fetchLogs() {
            if (logLoading) return;
            logLoading = true;
            try {
                const response = await fetch('/api/live_status');
                const result = await response.json();
                if (result.logs_a) {
                    const logEl = document.getElementById('processLogs');
                    const isScrolledToBottom = logEl.scrollHeight - logEl.clientHeight <= logEl.scrollTop + 50;
                    
                    // 检测日志内容是否有变化
                    if (result.logs_a === lastLogContent) {
                        noChangeCount++;
                        // 如果连续5次没有变化，降低轮询频率到10秒
                        if (noChangeCount >= 5 && logInterval) {
                            clearInterval(logInterval);
                            logInterval = setInterval(fetchLogs, 10000);
                            console.log('[BabyCry] 日志无更新，降低轮询频率至10秒');
                        }
                    } else {
                        noChangeCount = 0;
                        // 如果有变化且当前是低频模式，恢复高频
                        if (logInterval) {
                            clearInterval(logInterval);
                            logInterval = setInterval(fetchLogs, 3000);
                        }
                    }
                    lastLogContent = result.logs_a;
                    
                    logEl.textContent = result.logs_a;
                    if (isScrolledToBottom) {
                        logEl.scrollTop = logEl.scrollHeight;
                    }
                }
            } catch (e) {
                console.error("Fetch log error:", e);
            } finally {
                logLoading = false;
            }
        }

        function stopLogPolling() {
            if (logInterval) {
                clearInterval(logInterval);
                logInterval = null;
                console.log('[BabyCry] 日志轮询已停止');
            }
        }

        // 按需加载插图（点击图标时）
        const _illCache = {};  // 插图URL缓存
        async function triggerReprocess() {
            const btn = document.getElementById('reprocessBtn');
            const statusLabel = document.getElementById('triggerStatus');
            const isReplace = document.getElementById('replaceCheck')?.checked || false;
            
            btn.disabled = true;
            statusLabel.textContent = "⏳ 已向核心处理单元发送指令...";
            
            document.getElementById('logContainer').style.display = 'block';
            if (!logInterval) {
                noChangeCount = 0;
                lastLogContent = '';
                logInterval = setInterval(fetchLogs, 3000);  // 初始3秒轮询
            }
            
            try {
                const url = `/api/trigger_reprocess?replace=${isReplace}`;
                const response = await fetch(url, { method: 'POST' });
                const result = await response.json();
                
                if (response.ok) {
                    statusLabel.style.color = 'var(--accent)';
                    statusLabel.textContent = "🟢 分析阵列已上线: " + result.message;
                    // 5分钟后自动停止日志轮询
                    setTimeout(stopLogPolling, 5 * 60 * 1000);
                } else {
                    statusLabel.style.color = 'var(--danger)';
                    statusLabel.textContent = "🔴 阵列启动失败: " + result.error;
                    btn.disabled = false;
                    stopLogPolling();
                }
            } catch (e) {
                statusLabel.style.color = 'var(--danger)';
                statusLabel.textContent = "🔴 神经网络链路连接超时";
                btn.disabled = false;
                stopLogPolling();
            }
        }

        // 详情弹窗
        const _detailCache = {};
        async function showEventDetail(eventId) {
            const overlay = document.getElementById('detailOverlay');
            const content = document.getElementById('detailContent');
            if (!overlay) return;
            
            overlay.classList.add('active');
            content.innerHTML = '<div class="detail-loading">⏳ 加载详情中...</div>';

            try {
                // 使用缓存
                let data = _detailCache[eventId];
                if (!data) {
                    const resp = await fetch(`/api/cry_event/${eventId}`);
                    data = await resp.json();
                    _detailCache[eventId] = data;
                }

                const recTime = new Date(data.recording_time || data.created_at);
                const dateStr = recTime.toLocaleDateString();
                const timeStr = recTime.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
                const cat = (data.reason_category || 'pending').toLowerCase();
                
                let icon = '🍼';
                if (cat.includes('痛')||cat.includes('pain')) icon = '❤️‍🩹';
                if (cat.includes('困')||cat.includes('sleepy')) icon = '😴';
                if (cat.includes('情绪')||cat.includes('emotion')) icon = '🧸';

                const advice = data.advice || '建议保持严密观察。';
                let formattedAdvice = advice;
                if (advice.includes('1.') || advice.includes('1、')) {
                    const lines = advice.split(/(?=\d+[.,])/g);
                    formattedAdvice = '<ol>' + lines.map(l => `<li>${l.replace(/^\d+[.,]\s*/,'')}</li>`).join('') + '</ol>';
                }

                const imgHtml = data.illustration_url && !data.illustration_url.startsWith('data:')
                    ? `<div class="detail-section-title">🎨 分析插图</div><div class="detail-img-wrap"><img src="${data.illustration_url}" alt="插图" loading="lazy"></div>`
                    : '';

                // 音频列表
                const audioUrls = data.audio_urls || [];
                const filename = data.filename || '';
                let audioHtml = '';
                if (audioUrls.length > 0) {
                    const audioItems = audioUrls.map((url, idx) => {
                        const urlFilename = decodeURIComponent(url.split('/').pop());
                        const isCryFile = urlFilename === filename;
                        const audioId = `detail_audio_${eventId}_${idx}`;
                        return `
                            <div class="detail-audio-item">
                                <span class="detail-audio-icon">${isCryFile ? '👶' : '🎙️'}</span>
                                <span class="detail-audio-label">${isCryFile ? '哭声片段' : '上下文音频'}</span>
                                <span class="detail-audio-name">${urlFilename}</span>
                                <audio id="${audioId}" src="${url}" preload="none"></audio>
                                <button class="detail-play-btn" onclick="toggleDetailAudio('${audioId}', this)">${isCryFile ? '▶ 哭声' : '▶ 上下文'}</button>
                            </div>
                        `;
                    }).join('');
                    audioHtml = `
                        <div class="detail-section">
                            <div class="detail-section-title">🔊 音频预览</div>
                            <div class="detail-audio-list">${audioItems}</div>
                        </div>
                    `;
                }

                // 置信度
                const confidence = data.confidence ? Math.round(data.confidence * 100) : 0;
                const confHtml = confidence > 0 ? `<span>🎯 置信度 ${confidence}%</span>` : '';

                content.innerHTML = `
                    <button class="detail-close" onclick="closeDetail()">✕</button>
                    <div class="detail-header">
                        <h2>${data.reason||'未知诱因'}</h2>
                        <div class="detail-meta">
                            <span>${icon} ${data.reason_category||'未分类'}</span>
                            <span>📅 ${dateStr} ${timeStr}</span>
                            <span>⏱️ ${data.start_time||0}-${data.end_time||0}s</span>
                            ${data.file_count ? `<span>📁 ${data.file_count} 文件</span>` : ''}
                            ${confHtml}
                        </div>
                    </div>
                    <div class="detail-body">
                        ${audioHtml}
                        <div>
                            <div class="detail-section-title">💡 安抚建议</div>
                            <div class="advice-box-detail">${formattedAdvice}</div>
                        </div>
                        ${imgHtml}
                    </div>
                `;
            } catch(e) {
                content.innerHTML = '<div class="detail-loading" style="color:var(--danger)">加载失败，请重试</div>';
            }

            // 点击遮罩关闭
            overlay.onclick = function(e) { if(e.target===overlay) closeDetail(); };
        }

        function toggleDetailAudio(audioId, btn) {
            const audio = document.getElementById(audioId);
            if (!audio) return;
            if (_webPlayingAudio && _webPlayingAudio !== audio) {
                _webPlayingAudio.pause();
                _webPlayingAudio.currentTime = 0;
                const prevBtn = _webPlayingAudio.parentElement?.querySelector('.detail-play-btn');
                if (prevBtn) prevBtn.textContent = prevBtn.textContent.replace('⏸', '▶');
            }
            if (audio.paused) {
                audio.play().catch(() => {});
                btn.textContent = btn.textContent.replace('▶', '⏸');
                _webPlayingAudio = audio;
                audio.onended = () => { btn.textContent = btn.textContent.replace('⏸', '▶'); _webPlayingAudio = null; };
            } else {
                audio.pause();
                audio.currentTime = 0;
                btn.textContent = btn.textContent.replace('⏸', '▶');
                _webPlayingAudio = null;
            }
        }

        // 卡片上直接播放音频
        async function playWebCryAudio(eventId, btn) {
            let data = _detailCache[eventId];
            if (!data) {
                try {
                    const resp = await fetch(`/api/cry_event/${eventId}`);
                    data = await resp.json();
                    _detailCache[eventId] = data;
                } catch(e) { return; }
            }
            const urls = data.audio_urls || [];
            const filename = data.filename || '';
            const cryUrl = urls.find(u => decodeURIComponent(u.split('/').pop()) === filename);
            if (cryUrl) toggleCardPlay(cryUrl, btn);
        }
        async function playWebContextAudio(eventId, btn) {
            let data = _detailCache[eventId];
            if (!data) {
                try {
                    const resp = await fetch(`/api/cry_event/${eventId}`);
                    data = await resp.json();
                    _detailCache[eventId] = data;
                } catch(e) { return; }
            }
            const urls = data.audio_urls || [];
            const filename = data.filename || '';
            const ctxUrl = urls.find(u => decodeURIComponent(u.split('/').pop()) !== filename);
            if (ctxUrl) toggleCardPlay(ctxUrl, btn);
        }
        function toggleCardPlay(url, btn) {
            if (_webPlayingAudio) { _webPlayingAudio.pause(); _webPlayingAudio.currentTime = 0; _webPlayingAudio = null; }
            document.querySelectorAll('.card-play-btn.playing').forEach(b => { b.classList.remove('playing'); b.querySelector('.play-icon').textContent = '▶'; });

            const audio = new Audio(url);
            audio.play().then(() => {
                btn.classList.add('playing');
                btn.querySelector('.play-icon').textContent = '⏸';
                _webPlayingAudio = audio;
                audio.onended = () => { btn.classList.remove('playing'); btn.querySelector('.play-icon').textContent = '▶'; _webPlayingAudio = null; };
                audio.onerror = () => { btn.classList.remove('playing'); btn.querySelector('.play-icon').textContent = '▶'; _webPlayingAudio = null; };
            }).catch(() => {});
        }

        function closeDetail() {
            document.getElementById('detailOverlay').classList.remove('active');
        }
    </script>

    <!-- 详情弹窗 -->
    <div id="detailOverlay" class="detail-overlay">
        <div class="detail-panel" id="detailContent"></div>
    </div>
</body>
</html>
